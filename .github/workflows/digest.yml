name: Threads → Slack 다이제스트

on:
  schedule:
    # 09:00 KST = 00:00 UTC, 월·수·금 (2일 간격, 주말 제외)
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force:
        description: "스케줄 무시하고 강제 실행"
        type: boolean
        default: true

defaults:
  run:
    working-directory: threads-slack-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run digest
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_USERNAME: ${{ vars.SLACK_USERNAME }}
          SLACK_ICON_EMOJI: ${{ vars.SLACK_ICON_EMOJI }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          # workflow_dispatch 로 수동 실행 시 강제 실행
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: npm start
